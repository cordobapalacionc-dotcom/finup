
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Metas y Presupuestos</title>
    <link rel="stylesheet" href="metas.css">
    <script src="metas..js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">🐷 <span>Finanzas <b>Personales</b></span></div>
            <nav class="menu">
                <a href="inicio.html">Página Principal</a>
                <a href="gastos.html">Gastos e Ingresos</a>
                <a href="#" class="active">Metas</a>
                <a href="configuracion.html">Configuración</a>
            </nav>
            <div class="user-profile">
                <div id="userInfo" class="info" style="color: #5778a4;">
                    <b id="userName">Cargando...</b><br>
                    <span id="userRole">...</span>
                </div>
                <button id="btnLogout" class="btn-logout">Cerrar Sesión</button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main">
            <header class="header">
                <div>
                    <h1>🎯 Mis <span>Metas</span> de Ahorro</h1>
                    <p>Avanza y alcanza tus objetivos financieros</p>
                </div>
                <button class="btn" id="btnNuevaMeta">+ Nueva Meta</button>
            </header>

            <section id="metasContainer" class="goals">
                <!-- Se llena con JS -->
            </section>

            <header class="header">
                <div>
                    <h1>📊 Presupuestos <span>Mensuales</span></h1>
                    <p>Control de gastos por categoría</p>
                </div>
                <button class="btn btn-alt" id="btnNuevoPresupuesto">+ Nuevo Presupuesto</button>
            </header>

            <section id="presupuestosContainer" class="budgets-grid">
                <!-- Se llena con JS -->
            </section>

            <section class="summary">
                <div class="card"><p>Total de Metas</p><h3 id="countMetas">0</h3></div>
                <div class="card"><p>Ahorrado Total</p><h3 class="positive" id="totalAhorrado">$0</h3></div>
                <div class="card large">
                    <p>Progreso General</p>
                    <div class="progress-wrapper">
                        <div class="progress-bar-bg"><div id="progressGeneralBar" class="progress-fill gold"></div></div>
                        <span id="progressGeneralText" class="percentage-text">0%</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL ÚNICO (Reutilizable) -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Nueva Meta</h2>
            <form id="modalForm">
                <div id="metaInputs">
                    <div class="input-group"><label>Nombre</label><input type="text" id="metaNombre"></div>
                    <div class="input-group"><label>Monto Objetivo ($)</label><input type="number" id="metaMonto" min="0"></div>
                    <div id="editAhorroContainer" class="input-group hidden">
                        <label>Ahorro Actual ($)</label><input type="number" id="metaAhorro" min="0">
                    </div>
                </div>

                <div id="presupuestoInputs" class="hidden">
                    <div class="input-group">
                        <label>Categoría</label>
                        <select id="preCategoria" class="modal-select">
                            <option value="3">🍎 Alimentación</option>
                            <option value="4">🚗 Transporte</option>
                            <option value="5">🏠 Servicios</option>
                            <option value="6">🎉 Entretenimiento</option>
                            <option value="7">🛒 Otros Gastos</option>
                        </select>
                    </div>
                    <div class="input-group"><label>Límite Mensual ($)</label><input type="number" id="preLimite"></div>
                    <div class="input-group"><label>Gasto Real ($)</label><input type="number" id="preGastado"></div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="btnCerrarModal" class="btn-cancel">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
