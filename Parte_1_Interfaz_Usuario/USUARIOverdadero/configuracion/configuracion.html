<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - Finanzas Personales</title>
    <script src="configuracion.js"></script>
    <link rel="stylesheet" href="configuracion.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <!-- Barra lateral -->
        <aside class="sidebar">
            <div class="logo">
                <span>🐷 Finanzas <b>Personales</b></span>
            </div>
            <nav class="menu">
                <a href="inicio.html">Página Principal</a>
                <a href="gastos.html">Gastos e Ingresos</a>
                <a href="metas.html">Metas</a>
                <a href="#" class="active">Configuración</a>
            </nav>
            <div class="user-profile">
                <div class="info">
                    <b id="display-nombre">Usuario</b><br>
                    <span>Estudiante</span>
                </div>
                <div class="dark-mode-switch">
                    <span id="tema-icon">☀️</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-dark-mode">
                        <span class="slider round"></span>
                    </label>
                </div>
                <button class="btn-logout" id="btn-logout">Cerrar Sesión</button>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="contenido">
            <header class="header-section">
                <h1>Configuración</h1>
                <p class="subtitulo">Ajustes de cuenta y preferencias del sistema</p>
            </header>
            
            <div class="config-grid">
                <!-- Tarjeta Perfil -->
                <div class="card">
                    <div class="card-header">
                        <span class="icon">👤</span>
                        <h3>Perfil</h3>
                    </div>
                    <div class="input-group">
                        <label>Nombre de Usuario</label>
                        <input type="text" id="perfil-nombre" placeholder="Tu nombre">
                    </div>
                    <div class="input-group">
                        <label>Correo Electrónico</label>
                        <input type="email" id="perfil-correo" placeholder="correo@ejemplo.com">
                    </div>
                    <button class="btn-save" id="btn-guardar-perfil">Guardar Cambios</button>
                </div>
                
                <!-- Tarjeta Seguridad -->
                <div class="card">
                    <div class="card-header">
                        <span class="icon">🔒</span>
                        <h3>Seguridad</h3>
                    </div>
                    <div class="input-group">
                        <label>Contraseña Actual</label>
                        <input type="password" id="pass-actual" placeholder="Ingresa tu clave actual">
                    </div>
                    <div class="input-group">
                        <label>Nueva Contraseña</label>
                        <input type="password" id="pass-nueva" placeholder="Mín. 8 caracteres, letra y número">
                        <small id="error-pass" style="color: #ff4d4d; font-size: 11px; display: none; margin-top: 5px;">
                            Debe tener 8 caracteres, una letra y un número.
                        </small>
                    </div>
                    <button class="btn-save security" id="btn-actualizar-pass">Actualizar Contraseña</button>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
