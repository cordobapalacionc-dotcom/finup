<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos e Ingresos - Finanzas</title>
    <script src="gastos_e_ingresos.js"></script>
    <link rel="stylesheet" href="gastos_e_ingresos.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span>🐷 Finanzas <b>Personales</b></span>
            </div>
            <nav class="menu">
                <a href="#">Página Principal</a>
                <a href="#" class="active">Gastos e Ingresos</a>
                <a href="#">Metas</a>
                <a href="#">Configuración</a>
            </nav>
            <div class="user-profile">
                <div class="info">
                    <b id="user-name">Cargando...</b><br>
                    <span id="user-role">Usuario</span>
                </div>
                <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <header class="header">
                <div>
                    <h1>Gastos e Ingresos</h1>
                    <p>Monitorea tus finanzas personales en tiempo real</p>
                </div>
                <button class="btn" id="btn-nuevo-registro">+ Nuevo Registro</button>
            </header>

            <!-- Cards de Saldo -->
            <section class="saldo">
                <div class="saldo-box">
                    <h4>Saldo Actual</h4>
                    <h2 id="total-saldo">$0</h2>
                </div>
                <div class="card gasto">
                    <p>Total Gastos</p>
                    <h3 id="total-gastos" style="color:#e53e3e;">-$0</h3>
                </div>
                <div class="card ingreso">
                    <p>Total Ingresos</p>
                    <h3 id="total-ingresos" style="color:#2dbb73">+$0</h3>
                </div>
            </section>

            <!-- Gráfico Semanal -->
            <div class="chart-container">
                <div class="chart-header">
                    <h3>Reporte Semanal</h3>
                    <div class="scale-selector">
                        <label>Escala Máx:</label>
                        <select id="escala-manual">
                            <option value="0">Auto (Dinámico)</option>
                            <option value="100">100</option>
                            <option value="10000">10,000</option>
                            <option value="1000000">1,000,000</option>
                        </select>
                    </div>
                </div>
                <div class="chart-content">
                    <div class="bars" id="bars-container">
                        <!-- Las barras se generarán con JS -->
                    </div>
                </div>
            </div>

            <!-- Tabla -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Detalle</th>
                            <th>Categoría</th>
                            <th>Cantidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-registros">
                        <!-- Filas generadas con JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal-registro" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-titulo">Nuevo Registro</h2>
                <button class="close-btn" id="btn-cerrar-modal">&times;</button>
            </div>
            <div class="type-selector">
                <button id="selector-gasto" class="type-btn active-gasto">Gasto</button>
                <button id="selector-ingreso" class="type-btn">Ingreso</button>
            </div>
            <div class="modal-body">
                <div class="modal-grid">
                    <div class="input-group">
                        <label>Nombre</label>
                        <input type="text" id="reg-nombre" placeholder="Ej: Pago Mensual">
                    </div>
                    <div class="input-group">
                        <label>Monto</label>
                        <input type="number" id="reg-monto" min="0">
                    </div>
                    <div class="input-group">
                        <label>Categoría</label>
                        <select id="reg-categoria">
                            <!-- Opciones dinámicas según tipo -->
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Descripción</label>
                        <input type="text" id="reg-desc">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="btn-cancelar">Cancelar</button>
                <button class="btn-create" id="btn-guardar">Guardar</button>
            </div>
        </div>
    </div>

    <div id="tooltip" class="chart-tooltip" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
