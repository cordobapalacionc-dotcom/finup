
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Personales - Login</title>
    <script src="login.html"></script>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="wrapper">
            
            <!-- SECCIÓN LOGIN -->
            <div class="container" id="loginSection">
                <div class="logo">
                    <div class="logo-circle">$</div>
                    <div class="logo-text">Finanzas Personales</div>
                </div>
                <h1>Iniciar sesión</h1>
                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="emailLogin" placeholder="Tu@email.com" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="passwordLogin" placeholder="••••••••" required>
                </div>
                <button id="btnIngresar">Ingresar</button>
                <div class="register">
                    ¿No tienes cuenta? 
                    <a href="#" id="linkIrRegistro">Registrarte</a>
                </div>
                <div class="image">
                    <img src="./cartera.jpeg" alt="Imagen">
                </div>
            </div>

            <!-- SECCIÓN REGISTRO -->
            <div class="container registro-init" id="registroSection">
                <div class="logo">
                    <div class="logo-circle">$</div>
                    <div class="logo-text">Finanzas <span>Personales</span></div>
                </div>

                <div class="input-group">
                    <label>Nombre de Usuario</label>
                    <input type="text" id="nombreReg" placeholder="name" required>
                </div>

                <div class="input-group">
                    <label>Ingrese su Correo</label>
                    <input type="email" id="emailReg" placeholder="Tu@email.com" required>
                    <div id="emailError" class="error-message hidden">⚠️ Correo inválido</div>
                </div>

                <div class="input-group">
                    <label>Crear contraseña</label>
                    <input type="password" id="passwordReg" placeholder="••••••••" required>
                    
                    <div class="password-requirements">
                        <div id="reqMin" class="requirement">
                            <span class="requirement-icon">○</span>
                            <span>Mínimo 10 caracteres</span>
                        </div>
                        <div id="reqLetter" class="requirement">
                            <span class="requirement-icon">○</span>
                            <span>Al menos una letra</span>
                        </div>
                        <div id="reqNumber" class="requirement">
                            <span class="requirement-icon">○</span>
                            <span>Al menos un número</span>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label>Confirmar contraseña</label>
                    <input type="password" id="confirmReg" placeholder="••••••••" required>
                    <div id="confirmError" class="error-message hidden">⚠️ No coinciden</div>
                </div>

                <button id="btnCrearSesion" disabled>Crear sesión</button>

                <div id="volverLogin">
                    <span class="arrow">←</span>
                    <span class="back-text">Back</span>
                </div>

                <div class="image">
                    <img src="./cartera.jpeg" alt="Imagen">
                </div>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
