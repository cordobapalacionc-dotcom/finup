<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Personales</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f4f8;
            font-family: 'Poppins', sans-serif;
        }
        .redirect-box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #2dbb73;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { color: #1a202c; margin-bottom: 10px; }
        p { color: #6b7280; }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h2>💰 Finanzas Personales</h2>
        <p>Redirigiendo al panel correspondiente...</p>
    </div>

    <script>
        // Obtener sesión guardada
        const sesion = localStorage.getItem('usuario_identificado');
        
        if (sesion) {
            try {
                const usuario = JSON.parse(sesion);
                // Redirigir según el rol
                if (usuario.rol === 'admin') {
                    window.location.href = 'administrador/principal.html';
                } else {
                    window.location.href = 'usuario/dashboard.html';
                }
            } catch(e) {
                window.location.href = 'usuario/index.html';
            }
        } else {
            // Sin sesión, ir al login
            window.location.href = 'usuario/index.html';
        }
    </script>
</body>
</html>
